services:
  - type: web
    name: veritas-ai-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: AI_TIMEOUT_SECONDS
        value: "120"
      - key: AI_MAX_RETRIES
        value: "3"
      - key: AI_RETRY_BACKOFF_BASE
        value: "2.0"
      - key: PYTHON_VERSION
        value: "3.10"
    autoDeploy: true
    healthCheckPath: /health
    autoDeployTrigger: commit
    branch: main